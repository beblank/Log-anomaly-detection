apiVersion: v1
kind: Namespace
metadata:
  name: ml-saas
  labels:
    app: ml-saas
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-saas-api
  namespace: ml-saas
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ml-saas-api
  template:
    metadata:
      labels:
        app: ml-saas-api
    spec:
      containers:
      - name: api
        image: ml-saas/api:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8000
          name: metrics
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ml-saas-secrets
              key: database-url
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow-service:5000"
        - name: AWS_REGION
          value: "us-east-1"
        - name: K8S_IN_CLUSTER
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ml-saas-api-service
  namespace: ml-saas
spec:
  selector:
    app: ml-saas-api
  ports:
  - name: http
    port: 80
    targetPort: 8080
  - name: metrics
    port: 8000
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: v1
kind: Secret
metadata:
  name: ml-saas-secrets
  namespace: ml-saas
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres-service:5432/mlsaas"
