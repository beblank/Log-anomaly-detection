apiVersion: v1
kind: Namespace
metadata:
  name: ml-tenant-example
  labels:
    app.kubernetes.io/managed-by: ml-saas
    tenant: ml-tenant-example
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: ml-tenant-example
spec:
  hard:
    requests.cpu: "10"
    requests.memory: "20Gi"
    persistentvolumeclaims: "10"
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limits
  namespace: ml-tenant-example
spec:
  limits:
  - max:
      cpu: "2"
      memory: "4Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "250m"
      memory: "256Mi"
    type: Container
